# Add a unique section below portals to create another portal type.
# Reload with /aeternumportal reload. Destination worlds must already be loaded.
# Names of materials: Bukkit Material (e.g. BLUE_ICE, GLOWSTONE, AMETHYST_SHARD).
# Default shape VERTICAL: 4x5 frame with corners, 2x3 NETHER_PORTAL interior.
# HORIZONTAL_POOL: 4x4 rim with 12 flowers, 2x2 source water, solid floor.
schema: 1
portals:
  frost:
    enabled: true
    frame-block: BLUE_ICE
    activation:
      item: SNOWBALL
      mode: PROJECTILE
    # Insert the exact names of your source worlds here; empty means no source authorized.
    source-worlds: [world]
    destination-world: aeternum_frost

  # Examples disabled by default. Enabling these defines portals only, not world generators.
  heat:
    enabled: false
    frame-block: NETHER_WART_BLOCK
    activation:
      item: FLINT_AND_STEEL
      mode: INTERACT
    source-worlds: []
    destination-world: aeternum_heat

  aether:
    enabled: false
    frame-block: GLOWSTONE
    activation:
      item: AMETHYST_SHARD
      mode: INTERACT
    source-worlds: []
    destination-world: ethercraft_aether

  # Twilight Forest style. Set the exact loaded destination, then enable/reload.
  # Existing portal-types.yaml files are preserved: add this section manually.
  twilight:
    enabled: false
    shape: HORIZONTAL_POOL
    frame-block: MOSS_BLOCK
    activation:
      item: DIAMOND
      mode: DROP_ITEM # Throw one diamond into the water (Q); INTERACT is also supported.
    source-worlds: [world]
    destination-world: SET_LOADED_WORLD_NAME
