name: AeternumCustomPortal
version: '0.3.0'
main: io.github.mrserluiz.ethercraft.AeternumCustomPortalPlugin
api-version: '26.2'
author: Mrserluiz
description: Configurable portals to loaded worlds, with optional AeternumSeasons integration.
softdepend: [EtherCraftCustom, AeternumSeasons, WorldGuard, WorldEdit, GriefPrevention]
commands:
  aeternumportal:
    aliases: [acp, ethercraft]
    description: Administra portais customizados e destinos carregados
    usage: /aeternumportal status|worlds|select|link|unlink|remove|reload|types
    permission: aeternumcustomportal.admin
permissions:
  aeternumcustomportal.admin:
    default: op
  aeternumcustomportal.portal.use:
    default: true
  aeternumcustomportal.portal.activate:
    default: op
  ethercraft.admin:
    default: op
    children:
      aeternumcustomportal.admin: true
  ethercraft.portal.use:
    default: false
    children:
      aeternumcustomportal.portal.use: true
  ethercraft.portal.activate:
    default: op
    children:
      aeternumcustomportal.portal.activate: true
