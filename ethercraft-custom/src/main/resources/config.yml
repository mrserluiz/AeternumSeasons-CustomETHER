# Paper 26.2 / Java 25. World generation/loading is owned by Aeternum or another manager.
# Portals, activation and loaded world destinations: portal-types.yaml.
aeternum:
  # Disable only the known Aeternum portal listeners, preserving generation/seasons/mobs.
  # Keep Aeternum frost/heat features enabled so its worlds are loaded.
  take-over-portals: true
allow-unintegrated-protections: false
protection-plugins: [WorldGuard, GriefPrevention, Residence, Lands, Towny]

# First crossing builds/links a return portal near destination spawn, without excavating.
auto-return-portal: true
