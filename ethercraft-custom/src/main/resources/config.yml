# Paper 26.2 / Java 25. World generation/loading is owned by Aeternum or another manager.
# Portals, activation and loaded world destinations: portal-types.yaml.
aeternum:
  # Disable only the known Aeternum portal listeners, preserving generation/seasons/mobs.
  # Keep Aeternum frost/heat features enabled so its worlds are loaded.
  take-over-portals: true
allow-unintegrated-protections: false
protection-plugins: [WorldGuard, GriefPrevention, Residence, Lands, Towny]

# First crossing builds/links a return portal at the corresponding coordinates using the dimensions' coordinate scales.
auto-return-portal: true

portal-placement:
  # Existing portal search: default 16 in Nether environments, 128 elsewhere.
  # search-radius: 128
  creation-radius: 8
  # Clear only replaceable vegetation in existing headroom; never excavate solid ceilings.
  allow-terrain-clearing: true

# Test diagnostics are OFF by default. When enabled, chat diagnostics go ONLY to operators.
# Normal players never receive technical diagnostics, even with admin permission.
debug:
  enabled: false
  log-to-console: true

messages:
  # Brief gameplay feedback: ACTION_BAR (no chat spam), OFF (silent), or CHAT.
  player-feedback: ACTION_BAR

language:
  default: pt_BR
  # Optional client language detection; an explicit /acp language choice always wins.
  use-client-locale: false
# Players: /acp languages; /acp language en_US; /acp language auto.
# Translations: languages/<locale>.yml; reload with /acp reload.
