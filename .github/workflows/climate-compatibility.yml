name: Climate compatibility core tests
on:
  push:
    paths: ['Kinkin/aeternum/calendar/WorldClimateProfile.java', 'Kinkin/aeternum/world/BiomePaletteResolver.java', 'tests/ClimateCompatibilityTest.java', 'tools/test-climate-compatibility.sh', '.github/workflows/climate-compatibility.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - run: bash tools/test-climate-compatibility.sh
