events:
  enabled: true                      # Activar eventos / Enable events
  require_players:
    enabled: false                   # Requerir jugadores / Require players
    players: 3                       # Mínimo jugadores / Min players
  visual_effects:
    particles_enabled: true          # Partículas eventos / Event particles


  blood_moon:
    enabled: true                    # Luna de sangre / Blood Moon
    chance_per_night: 0.08           # Probabilidad / Chance
    min_day: 10                      # Día mínimo / Min day
    max_times_per_season: 6          # Máx por estación / Max per season
    world_time_night: false           # Forzar noche / Force night
    freeze_night: false              # Congelar noche / Freeze night

  heat_wave:
    enabled: true                    # Ola de calor / Heat wave
    max_per_summer: 6                # Máx por verano / Max per summer
    min_duration_days: 1             # Duración mín / Min duration
    max_duration_days: 4             # Duración máx / Max duration
    base_chance_per_day: 0.12        # Probabilidad / Chance
    damage_exposed: true             # Daño por exposición / Exposure damage
    tick_damage: 0.5                 # Daño por tick / Tick damage
    apply_weakness: true             # Debilidad / Apply weakness
    min_armor_protection: 2          # Armadura mínima / Min armor

  winter_freeze:
    enabled: true                    # Gran helada / Winter freeze
    max_per_winter: 3                # Máx por invierno / Max per winter
    min_duration_days: 2             # Duración mín / Min duration
    max_duration_days: 5             # Duración máx / Max duration
    base_chance_per_day: 0.15        # Probabilidad / Chance
    damage_per_tick: 0.5             # Daño por tick / Damage per tick
    min_armor_pieces: 2              # Piezas armadura / Armor pieces
    heat_radius_blocks: 5            # Radio calor / Heat radius
    heat_block_types:                # Bloques de calor / Heat blocks
      - CAMPFIRE
      - SOUL_CAMPFIRE
      - TORCH
      - SOUL_TORCH
      - LANTERN
      - FIRE
      - FURNACE

  magic_storm:
    enabled: true                    # Tormenta mágica / Magic storm
    min_duration_days: 1             # Duración mín / Min duration
    max_duration_days: 1             # Duración máx / Max duration
    base_chance_per_day: 0.08        # Probabilidad / Chance
    allowed_seasons: [ SPRING, SUMMER, AUTUMN, WINTER ]
    rare_mob_chance: 0.35            # Mobs raros / Rare mob chance
    extra_loot_chance: 0.40          # Botín extra / Extra loot chance

  festival:
    enabled: true                    # Festival / Festival event
    min_duration_days: 1             # Duración mín / Min duration
    max_duration_days: 2             # Duración máx / Max duration
    base_chance_per_day: 0.10        # Probabilidad / Chance
    max_per_season: 3                # Máx por estación / Max per season

  fishing:
    enabled: true                    # Evento pesca / Fishing event
    min_duration_days: 1             # Duración mín / Min duration
    max_duration_days: 2             # Duración máx / Max duration
    base_chance_per_day: 0.10        # Probabilidad / Chance
    max_per_year: 48                 # Máx por año / Max per year
    treasure_chance: 0.35            # Tesoros / Treasure chance
    double_catch_chance: 0.30        # Doble pesca / Double catch

  mining:
    enabled: true                    # Evento minería / Mining event
    min_duration_days: 1             # Duración mín / Min duration
    max_duration_days: 2             # Duración máx / Max duration
    base_chance_per_day: 0.12        # Probabilidad / Chance
    max_per_year: 36                 # Máx por año / Max per year
    extra_ore_chance: 0.35           # Menas extra / Extra ore chance
    exp_boost_chance: 0.40           # Bono EXP / EXP boost
    rare_bonus_chance: 0.08          # Bono raro / Rare bonus

  tornado:
    enabled: true                    # Tornado / Tornado event
    base_chance_per_day: 0.05        # Probabilidad / Chance
    min_duration_days: 1             # Duración mín / Min duration
    max_duration_days: 1             # Duración máx / Max duration
    min_duration_minutes: 5          # Minutos mín / Min minutes
    max_duration_minutes: 10         # Minutos máx / Max minutes
    targets:
      max_targets: 5                 # Máx objetivos / Max targets
      cluster_distance: 64           # Distancia grupo / Cluster dist
      viewer_distance: 96            # Distancia visión / Viewer dist
      only_survival_adventure: true  # Solo survival / Survival only
      per_players: 30                # Jugadores por target / Players per target
      cooldown_days_per_player: 2    # Cooldown jugador / Player cooldown
    radius_blocks: 10.0              # Radio bloques / Radius blocks
    height_blocks: 24.0              # Altura bloques / Height blocks
    min_spawn_distance: 20.0         # Spawn mín / Min spawn dist
    max_spawn_distance: 24.0         # Spawn máx / Max spawn dist
    drift_speed: 0.18                # Velocidad / Drift speed
    allowed_worlds: []               # Mundos permitidos / Allowed worlds
    disabled_worlds:                 # Mundos desactivados / Disabled worlds
      - lobby
      - aeternum_heat

  restful_sleep:
    enabled: true                    # Sueño reparador / Restful sleep
    min_duration_days: 1             # Duración mín / Min duration
    max_duration_days: 2             # Duración máx / Max duration
    base_chance_per_day: 0.10        # Probabilidad / Chance
    health_boost_seconds: 600        # Bono salud (seg) / Health boost (sec)

  holiday:
    enabled: true                    # Festivos / Holiday events
    halloween:
      mob_radius: 24.0               # Radio mobs / Mob radius
      pumpkin_chance: 1.0            # Prob. calabaza / Pumpkin chance
      buff_chance: 0.8               # Prob. mejora / Buff chance
    christmas:
      gift_radius: 8.0               # Radio regalos / Gift radius
      heal_radius: 12.0              # Radio cura / Heal radius
      heal_amount: 0.5               # Cantidad cura / Heal amount

  new_year:
    enabled: true                    # Año nuevo / New Year
    weight: 1.0                      # Peso / Weight
    min_gap_days: 340               # Separación mín / Min gap
    max_gap_days: 380               # Separación máx / Max gap
    seasons: [SPRING]                # Estaciones / Seasons
    fireworks_chance: 0.60           # Prob. fuegos / Fireworks chance
    fireworks_bursts: 3              # Explosiones / Bursts
    gift_rockets_min: 12             # Cohetes mín / Min rockets
    gift_rockets_max: 24             # Cohetes máx / Max rockets
    gift_gunpowder_min: 6            # Pólvora mín / Min gunpowder
    gift_gunpowder_max: 12           # Pólvora máx / Max gunpowder

  nether_fishing_derby:
    enabled: true                    # Pesca en lava / Nether fishing
    min_duration_days: 1             # Duración mín / Min duration
    max_duration_days: 1             # Duración máx / Max duration
    base_chance_per_day: 0.08        # Probabilidad / Chance
