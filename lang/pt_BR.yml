guide:
  # Título general (se usa tanto en chat como en el libro)
  title: "Guia das Estações de Aeternum"

  # Título y autor del libro escrito
  book_title: "Guia das Estações de Aeternum"
  book_author: "Aeternum"
  book_given: "O guia das estações foi entregue a você."

  # Línea con la estación actual
  current: "Estação Atual: {season}"

  # Primer párrafo del libro
  intro: "Este guia resume o clima, eventos, colheitas e migração de animais para cada estação."

  section:
    events: "§0Eventos Sazonais"
    crops: "§0Colheitas por Estação"
    migration: "§0Migração Animal"
    stables: "Estábulos e Celeiros"
    weather: "§0Clima Típico"
    crafting: "Criação Especial"
    dimensions: "Dimensões"

  crafting: # <- Y AQUÍ DENTRO tus recetas
    advanced_composter: |
      §6Composteira Avançada§7
      §7Receita:
      §2[L] [H] [L]
      §2[P] [C] [P]
      §2[L] [H] [L]
      §1L = qualquer folha
      §1H = funil
      §1P = abóbora
      §1C = composteira

    harvest_hoe: |
      §6Enxada da Colheita§7
      §7Receita:
      §2[W] [W] [W]
      §2[E] [H] [E]
      §2[E] [E] [E]
      §1W = trigo
      §1E = esmeralda
      §1H = qualquer enxada

    farmer_boots: |
      §6Botas do Fazendeiro§7
      §7Receita:
      §2[W] [B] [W]
      §2[W] [S] [W]
      §2[W] [W] [W]
      §1W = trigo
      §1B = botas
      §1S = pá (pedra/diamante)

    lunar_lantern: |
      §6Lanterna Lunar§7
      §7Receita:
      §2[R] [L] [R]
      §2[R] [E] [R]
      §2[R] [L] [R]
      §1R = redstone
      §1L = lanterna
      §1E = pérola do Ender

    solar_torch: |
      §6Tocha Solar§7
      §7Receita:
      §2[B] [B] [B]
      §2[ ] [T] [ ]
      §2[ ] [F] [ ]
      §1B = pó de blaze
      §1T = tocha normal
      §1F = Girassol

    spring_bell: |
      §dSino da Primavera§7
      §7Receita:
      §2[A] [P] [A]
      §2[P] [B] [P]
      §2[A] [P] [A]
      §1A = fragmento de ametista
      §1P = pétala / flor rosa
      §1B = sino

    spring_boots: |
      §dBotas do Passo Primaveril§7
      §7Receita:
      §2[P] [P] [P]
      §2[P] [B] [P]
      §2[P] [P] [P]
      §1P = pétala / flor rosa
      §1B = botas

    snow_boots: |
      §6Botas Anti-Neve§7
      §7Receita:
      §2[ ] [B] [ ]
      §2[ ] [S] [ ]
      §2[ ] [S] [ ]
      §1B = botas
      §1S = balde de Neve em Pó

    woodcutter_axe: |
      §6Machado de Corte Natural§7
      §7Receita:
      §2[L] [A] [L]
      §2[O] [ ] [O]
      §2[L] [ ] [L]
      §1L = qualquer folha
      §1O = qualquer tronco
      §1A = qualquer machado

    frost_core: |
      §6Núcleo Invernal§7
      §7Receita:
      §2[S] [I] [S]
      §2[I] [B] [I]
      §2[S] [I] [S]
      §1S = Bloco de neve
      §1I = Gelo compactado
      §1B = Coração do Mar
      §7Clique com o botão direito em um Golem de Neve para atualizá-lo.

    guardian_core: |
      §6Núcleo Guardião§7
      §7Receita:
      §2[I] [B] [I]
      §2[B] [G] [B]
      §2[I] [B] [I]
      §1I = Bloco de ferro
      §1B = Lingote de ferro
      §1G = Fragmento de ametista
      §7Clique com o botão direito em um Golem de Ferro.

    fish_trap: |
      §6Armadilha de Pesca§7
      §7Receita:
      §2[S] [ ] [S]
      §2[S] [B] [S]
      §2[S] [ ] [S]
      §1S = barbante
      §1B = barril

    creature_generator: |
      §6Armadilha de Criaturas§7
      §7Receita:
      §2[S] [I] [S]
      §2[I] [T] [I]
      §2[S] [I] [S]
      §1S = barbante
      §1I = lingote de ferro
      §1T = graveto

    Clock: |
      §6Relógio Sazonal§7
      §7Receita:
      §2[ ] [B] [ ]
      §2[ ] [R] [ ]
      §2[ ] [ ] [ ]
      §1B = Bússola
      §1R = Relógio


