guide_food:
  title: "&6Livro de Receitas Aeternum"
  author: "&aChef Viajante"

  page1: |
    &0&lLivro de Receitas Aeternum

    &0Este pequeno livro reúne
    &0algumas das receitas
    &0favoritas de fazendeiros
    &0e viajantes.

    &0Novas culturas sazonais:

    &cTomate&0 – suculento e
    &0fresco, ótimo em saladas
    &0e sanduíches.

    &6Cebola&0 – cheiro forte
    &0mas perfeita para guisados
    &0e pães.

    &6Arroz&0 – cultivado na água.
    &0Plante as sementes em
    &0lagos rasos para obter
    &0talos de arroz.

  page2: |
    &0&lPratos Básicos

    &6Salada de Tomate&0
    &7Tigela + 2x Tomate
    &0Uma salada leve que
    &0restaura um pouco da fome
    &0e dá um pouco de
    &0regeneração.

    &6Pão de Vegetais&0
    &7Pão + Tomate + Cebola
    &0Um pão farto recheado
    &0com vegetais sazonais.
    &0Dá um pequeno escudo de
    &0corações de absorção.

    &6Sanduíche de Carne&0
    &7Pão + carne cozida +
    &7Tomate + Cebola
    &0Um sanduíche substancial que
    &0concede resistência e
    &0força extra.

  page3: |
    &0&lArroz e Ensopados

    &6Plantio de Arroz&0
    &0Sementes de arroz podem ser plantadas
    &0em água parada. Elas crescem
    &0como talos altos, como algas marinhas.

    &0Quebrar o talo rende
    &0mais sementes de arroz para plantar
    &0novamente.

    &6Ensopado de Carne e Arroz&0
    &7Tigela + carne cozida +
    &7Arroz
    &0Um ensopado quente que satisfaz
    &0muita fome, restaura
    &0a saúde ao longo do tempo e
    &0aumenta brevemente a saturação.

  page4: |
    &0&lBebidas

    &6Café&0
    &7Garrafa + Cacau + Açúcar
    &0Quente e amargo. Remove
    &0o congelamento, concede velocidade
    &0e visão noturna por
    &0um tempo.

    &6Chá de Ervas&0
    &7Garrafa + flor da floresta
    &0Infusão calmante que
    &0cura suavemente, ajuda
    &0contra o frio e
    &0dá um pequeno impulso de saúde.

    &6Bebida Energética&0
    &7Garrafa + Açúcar + Redstone
    &7+ Pó de Glowstone
    &0Muito doce e efervescente.
    &0Concede forte velocidade e
    &0pressa por um curto período.

    &6Chocolate Quente&0
    &7Garrafa + Cacau + Leite
    &0Perfeito para noites
    &0de inverno. Aquece você,
    &0bloqueia o congelamento e concede
    &0resistência e absorção.

  page5: |
    &6Terra fértil&0
    Receita do fertilizante rico:

      §2[T] [R] [R]
      §2[W] [W] [B]
      §2[B] [B] [B]

    T = Terra
    R = Carne podre
    W = Trigo
    B = Farinha de ossos

    &7Dizem que um cozinheiro errante descobriu como fazer suas plantações crescerem muito mais rápido graças a um fertilizante especial.&0
    &cSiga esta receita para preparar o composto cru:&0
    &7se você o deixar na água por dois dias,
    ele se transformará em uma terra rica perfeita para o cultivo.&0  

