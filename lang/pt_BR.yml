frost_guide:
  book_title: "Guia do Mundo Congelado"
  book_author: "Cartógrafo das Estações de Aeternum"

  page1: |
    §9Reino Gelofrio Eterno
    §7Você atravessou o portal de glowstone e chegou
    em um reino de inverno sem fim.
    
    §1Você pode construir sua base, minerar e explorar,
    §4mas lembre-se que os inimigos são mais fortes§7.
  

  page2: |
    §9Perigos do gelo
    
    §7No Reino Gelofrio Eterno quase todo inimigo tem
    variantes congeladas.
    
    §4Continue se movendo e sempre carregue
    boa armadura e comida.

  page3: |
    §9Glacialis, Coração do Inverno
    
    §7Este boss é a razão pela qual esta dimensão está
    presa em um inverno eterno.
    §4Glacialis aparece à noite no Reino Gelofrio Eterno,
    a cada §628 dias§7.
    Seu saque é especial para a armadura Gelofrio Eterno.

  page4: |
    §6Elmo de Gelofrio Eterno
    §7Receita:
    §2[S] [S] [S]
    §2[S] [C] [S]
    §2[ ] [H] [ ]
    
    §1S = Fragmento de Gelo Eterno
    §1C = Núcleo de Glacialis
    §1H = Capacete de Diamante
    
    §7O Elmo de Gelofrio Eterno é a primeira peça para
    enfrentar o calor infernal.

  page5: |
    §6Peitoral de Gelofrio Eterno
    §7Receita:
    §2[ ] [C] [ ]
    §2[S] [A] [S]
    §2[S] [ ] [S]
    
    §1S = Fragmento de Gelo Eterno
    §1C = Núcleo de Glacialis
    §1A = Peitoral de Diamante
    
    §7O Peitoral de Gelofrio Eterno reforça seu corpo.

  page6: |
    §6Perneiras de Gelofrio Eterno
    §7Receita:
    §2[S] [C] [S]
    §2[S] [A] [S]
    §2[S] [A] [S]
    
    §1S = Fragmento de Gelo Eterno
    §1C = Núcleo de Glacialis
    §1A = Calças de Diamante
    
    §7Elas são feitas para terrenos escaldantes.

  page7: |
    §6Botas de Gelofrio Eterno
    §7Receita:
    §2[ ] [C] [ ]
    §2[S] [A] [S]
    §2[S] [ ] [S]
    
    §1S = Fragmento de Gelo Eterno
    §1C = Núcleo de Glacialis
    §1A = Botas de Diamante
    
    §7As botas são essenciais para
    suportar o calor.

  page8: |
    §4A próxima dimensão
    §7Um mundo esquecido e §Devorado pelo Nether§7 
    que leva a um reino de calor infernal.
    
    §7Lá os inimigos são ainda mais fortes, com
    saúde e dano multiplicados.
    
    §7Com o conjunto Gelofrio Eterno completo
    você estará pronto para as chamas infernais.

  page9: |
    §4Reino Ardente
    §7Construção:
    §2[W] [W] [W] [W]
    §2[W] [ ] [ ]  [W]
    §2[W] [ ] [ ]  [W]
    §2[W] [ ] [ ]  [W]
    §2[W] [W] [W] [W]
    
    §1W = Bloco de Nether Wart
    §1Acenda-o com pederneira e aço

  page10: |
    §4O Reino Ardente
    Você só pode alcançar este lugar com a armadura Gelofrio Eterno.
    Se você decidir entrar sem ela, você queimará até a morte.

guide_heat:
  book_title: "Guia de Sobrevivência Ardente"
  book_author: "Arquivos Aeternum"

  page1: |
    §4§lREINO ARDENTE
    §cVocê cruzou para o Reino Ardente.

    §6Aqui o ar queima, a pedra sangra fogo
    e nada quer que você permaneça vivo.
    §4Este reino pode ser o fim da sua jornada…
    §c…ou o lugar onde você renasce em chamas.

  page2: |
    §6§lSOBREVIVÊNCIA BÁSICA

    §8• §cO calor constante §6o consumirá
    sem proteção adequada.
    §8• §6Nunca venha sem §acomida§6, §ablocos §6e
    §apoções §6prontas.
    §8• §cNão venha sozinho §6se você ainda não conhece
    os segredos deste reino.

  page3: |
    §3§lARMADURA FORJADA NO INVERNO

    §6Apenas o conjunto completo §1Gelofrio Eterno §6pode resistir
    ao clima extremo.
    §cSem o conjunto§6, fogo e lava
    irão derretê-lo sem piedade.
    §1Com ele§6, você pode andar através das chamas
    como se fossem pedra sólida.

  page4: |
    §4§lCRIATURAS DO REINO

    §8• §6Mobs aqui são aproximadamente
    §c4 vezes mais fortes.
    §8• §6Eles têm §cmais saúde§6, §cmais dano §6e quase
    todos causam §cdano de fogo§6.
    §8• §6Existem variantes de fogo.
    §cse você as subestimar, você morrerá.

  page5: |
    §6§lSAQUE E RISCO

    §8• §6Ruínas e torres escondem equipamentos com
    encantamentos muito acima do normal.
    §8• §6É o melhor saque em §5Aeternum§6
    §aSe você chegou até aqui, já provou sua coragem.
    §2Agora prove que é capaz
    de voltar vivo.

