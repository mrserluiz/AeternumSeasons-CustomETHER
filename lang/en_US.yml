      activate: "Activate it by throwing a snow ball at the portal."

      warning_title: "Warning: Extreme Weather"
      warning_1: "During snowstorms, your vision is almost completely reduced."
      warning_2: "Only with a light source or sheltered inside a cave will you be able to see."
      warning_3: "The cold intensifies, protect yourself well."

    emberbound:
      title: "Portal to the Infernal World"
      build_glitched: "Construc..."
      block: "Block SDFSD"
      glitch_warning: "It seems the information for this world is corrupted..."

  events:
    blood_moon: "§cBlood Moon§7: stronger mobs, you cannot sleep."
    heat_wave: "§6Heat Wave§7: the sun is exhausting if you're not in the shade."
    winter_freeze: "§9Cold Wave§7: without proper clothing you freeze quickly."
    magic_storm: "§9Magic Storm§7: weird weather and magical loot."
    festival: "§6Festivals§7: villagers, trades, and decoration."
    fishing: "§9Fishing Festival§7: extra loot when fishing."
    mining: "§6Mining Blessing§7: more minerals and better drops."
    tornado: "§7Tornado§7: wind that drags and damages crops."
    restful_sleep: "§9Restful Sleep§7: sleeping gives temporary extra health."

  crops:
    SPRING: "Wheat, carrots, potatoes, beetroot, and pumpkins prosper; a very good general growing season."
    SUMMER: "Watermelons, sugarcane, cactus, and heat-tolerant crops grow best."
    AUTUMN: "Pumpkins, mushrooms, and roots; ideal for large harvests and storage."
    WINTER: "Almost nothing grows outdoors; greenhouses allow continued cultivation."

  migration:
    SPRING: "More sheep, bees, and rabbits in flowery meadows and forests."
    SUMMER: "More tropical fish, dolphins, turtles, and axolotls in warm seas."
    AUTUMN: "Foxes, wolves, and goats concentrate in taigas and mountainous areas."
    WINTER: "Wolves and polar bears dominate cold biomes; many warm-climate animals disappear."

  stables:
    winter: "Animals that are not cold-resistant may die if they don't have a stable or shelter."
    breeding: "Breeding is less effective (or none) if they are not in a stable."
    bonus_drops: "Animals raised or protected in stables will drop more loot (meat, feathers, wool, leather)."

  weather:
    SPRING: "Gentle rains, mild weather, and longer days that favor crops."
    SUMMER: "Intense sun, strong heat, and some violent storms."
    AUTUMN: "Cool wind, cloudy skies, and abrupt temperature changes."
    WINTER: "Frequent snow, extreme cold, and risk of freezing if you don't protect yourself."

  footer: " use /seasonguide."

