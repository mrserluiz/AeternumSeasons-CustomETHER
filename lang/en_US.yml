cmd:
  event:
    no_permission: "&cYou don't have permission to use this command."
    usage: "&eUsage: {cmd} <list|info|start|stop> [id] [days]"
    list:
      header: "&6Registered events:"
      item: "&7- &e{id}&7 (&f{name}&7)"
    started: "&aEvent &e{id}&a forced to start."
    stopped: "&cActive event stopped."
    no_such_event: "&cNo event found with id &e{id}&c."
    no_active: "&7There is no active event right now."
    info: "&6Active event: &e{id}&7 (&f{name}&7), &e{days}&7 day(s) remaining."

  season:
    no_permission: "&cYou don't have permission to use this command."

    info:
      line: "&bSeason: {season}&7 | Day {day}/{max}&3 | Year {year}"

    set:
      usage: "&eUsage: /{label} set <SPRING|SUMMER|AUTUMN|WINTER>"
      invalid: "&cInvalid season."
      success: "&6Season set to {season}."

    skipday:
      done: "&6You have skipped 1 day."

    day:
      usage: "&eUsage: /{label} day <1..{max}>"
      invalid_number: "&cInvalid number."
      success: "&6Day set to {day} (current season)."

    year:
      usage: "&eUsage: /{label} year <number>"
      invalid_number: "&cInvalid year number."
      success: "&aCalendar year set to &f{year}&a."

    reload:
      done: "&aConfigurations reloaded."

    hud:
      player_only: "&cThis command can only be used by a player."
      usage: "&eUsage: /{label} hud <fixed|variable|off>"
      current: "&7Current mode: &b{mode}"
      invalid: "&cInvalid mode. Use: &efixed&c, &evariable&c or &eoff&c."
      mode:
        fixed: "fixed"
        variable: "variable"
        off: "off"
      set:
        fixed: "&aStatic HUD display enabled."
        variable: "&aVariable HUD mode enabled."
        off: "&aHUD disabled."

    help: "&eUsage: /{label} <info| set| skipday| day| reload| hud>"

