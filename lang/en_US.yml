guide_food:
  title: "&6Aeternum Cookbook"
  author: "&aWandering Chef"

  page1: |
    &0&lAeternum Cookbook

    &0This small book gathers
    &0some of the favourite
    &0recipes from farmers
    &0and travellers.

    &0New seasonal crops:

    &cTomato&0 – juicy and
    &0fresh, great in salads
    &0and sandwiches.

    &6Onion&0 – strong smell
    &0but perfect for stews
    &0and breads.

    &6Rice&0 – grown in water.
    &0Plant the seeds in
    &0shallow ponds to get
    &0rice stalks.

  page2: |
    &0&lBasic dishes

    &6Tomato Salad&0
    &7Bowl + 2x Tomato
    &0A light salad that
    &0restores some hunger
    &0and gives a bit of
    &0regeneration.

    &6Vegetable Bread&0
    &7Bread + Tomato + Onion
    &0A filling bread stuffed
    &0with seasonal veggies.
    &0Gives a small shield of
    &0absorption hearts.

    &6Meat Sandwich&0
    &7Bread + cooked meat +
    &7Tomato + Onion
    &0A hearty sandwich that
    &0grants resistance and
    &0extra strength.

  page3: |
    &0&lRice and stews

    &6Rice planting&0
    &0Rice seeds can be planted
    &0on still water. They grow
    &0as tall stalks, like kelp.

    &0Breaking the stalk yields
    &0more rice seeds to plant
    &0again.

    &6Beef Rice Stew&0
    &7Bowl + cooked meat +
    &7Rice
    &0A warm stew that fills a
    &0lot of hunger, restores
    &0health over time and
    &0briefly boosts saturation.

  page4: |
    &0&lDrinks

    &6Coffee&0
    &7Bottle + Cocoa + Sugar
    &0Hot and bitter. Removes
    &0freezing, grants speed
    &0and night vision for a
    &0while.

    &6Herbal Tea&0
    &7Bottle + forest flower
    &0Calming infusion that
    &0gently heals, helps
    &0against the cold and
    &0gives a small health
    &0boost.

    &6Energy Drink&0
    &7Bottle + Sugar + Redstone
    &7+ Glowstone dust
    &0Very sweet and fizzy.
    &0Grants strong speed and
    &0haste for a short time.

    &6Hot Chocolate&0
    &7Bottle + Cocoa + Milk
    &0Perfect for winter
    &0nights. Warms you up,
    &0blocks freezing and gives
    &0resistance and absorption.

  page5: |-
    &6Rich Farmland&0
    Recipe for rich fertilizer:

      §2[T] [R] [R]
      §2[W] [W] [B]
      §2[B] [B] [B]

    T = Dirt
    R = Rotten Flesh
    W = Wheat
    B = Bone Meal

    &7Legends say a wandering cook discovered how to make his crops grow much faster thanks to a special fertilizer.&0
    &cFollow this recipe to prepare the raw compost:&0
    &7if you leave it in water for two days,
    it will turn into a rich soil perfect for farming.&0   

