frost_guide:
  book_title: "Frozen World Guide"
  book_author: "Cartographer of Aeternum Seasons"

  page1: |
    §9Everfrost Realm
    §7You have crossed the glowstone portal and arrived
    in a realm of endless winter.
    
    §1You can build your base, mine and explore,
    §4but remember the enemies are stronger§7.
    

  page2: |
    §9Dangers of the ice
    
    §7In the Everfrost Realm almost every enemy has
    frozen variants.
    
    §4Keep moving and always carry
    good armor and food.

  page3: |
    §9Glacialis, Heart of Winter
    
    §7This boss is the reason this dimension is
    trapped in an eternal winter.
    §4Glacialis appears at night in the Everfrost Realm,
    every §628 days§7.
    His loot is special for the Everfrost armor.

  page4: |
    §6Everfrost Helm
    §7Recipe:
    §2[S] [S] [S]
    §2[S] [C] [S]
    §2[ ] [H] [ ]
    
    §1S = Eternal Ice Shard
    §1C = Glacialis Core
    §1H = Diamond Helmet
    
    §7The Everfrost Helm is the first piece to
    face the infernal heat.

  page5: |
    §6Everfrost Chestplate
    §7Recipe:
    §2[ ] [C] [ ]
    §2[S] [A] [S]
    §2[S] [ ] [S]
    
    §1S = Eternal Ice Shard
    §1C = Glacialis Core
    §1A = Diamond Chestplate
    
    §7The Everfrost Chestplate reinforces your body.

  page6: |
    §6Everfrost Greaves
    §7Recipe:
    §2[S] [C] [S]
    §2[S] [A] [S]
    §2[S] [A] [S]
    
    §1S = Eternal Ice Shard
    §1C = Glacialis Core
    §1A = Diamond Leggings
    
    §7They are meant for scorching terrain.

  page7: |
    §6Everfrost Boots
    §7Recipe:
    §2[ ] [C] [ ]
    §2[S] [A] [S]
    §2[S] [ ] [S]
    
    §1S = Eternal Ice Shard
    §1C = Glacialis Core
    §1A = Diamond Boots
    
    §7The boots are essential to
    endure the heat.

  page8: |
    §4The next dimension
    §7A forgotten world and §Devoured by the Nether§7 
    that leads to a realm of infernal heat.
    
    §7There the enemies are even stronger, with
    health and damage multiplied.
    
    §7With the full Everfrost set
    you will be ready for the infernal flames.

  page9: |
    §4Emberbound Realm
    §7Construction:
    §2[W] [W] [W] [W]
    §2[W] [ ] [ ]  [W]
    §2[W] [ ] [ ]  [W]
    §2[W] [ ] [ ]  [W]
    §2[W] [W] [W] [W]
    
    §1W = Nether Wart Block
    §1Light it with a flint and steel

  page10: |
    §4The Emberbound Realm
    You can only reach this place with the Everfrost armor.
    If you decide to enter without it, you will burn to death.

guide_heat:
  book_title: "Emberbound Survival Guide"
  book_author: "Aeternum Archives"

  page1: |
    §4§lEMBERBOUND REALM
    §cYou have crossed into the Emberbound Realm.

    §6Here the air burns, the stone bleeds fire
    and nothing wants you to stay alive.
    §4This realm may be the end of your journey…
    §c…or the place where you are reborn in flames.

  page2: |
    §6§lBASIC SURVIVAL

    §8• §cThe constant heat §6will consume you
    without proper protection.
    §8• §6Never come without §afood§6, §ablocks §6and
    §apotions §6ready.
    §8• §cDo not come alone §6if you still don’t know
    the secrets of this realm.

  page3: |
    §3§lWINTERFORGE ARMOR

    §6Only the full §1Everfrost §6set can withstand
    the extreme climate.
    §cWithout the set§6, fire and lava
    will melt you without mercy.
    §1With it§6, you can walk through the flames
    as if they were solid stone.

  page4: |
    §4§lCREATURES OF THE REALM

    §8• §6Mobs here are approximately
    §c4 times stronger.
    §8• §6They have §cmore health§6, §cmore damage §6and almost
    all of them deal §cfire damage§6.
    §8• §6There are fiery variants.
    §cif you underestimate them, you die.

  page5: |
    §6§lLOOT AND RISK

    §8• §6Ruins and towers hide gear with
    enchantments far above normal.
    §8• §6It is the best loot in §5Aeternum§6
    §aIf you’ve made it this far, you’ve already proved your courage.
    §2Now prove you are capable
    of returning alive.

